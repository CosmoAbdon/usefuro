name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # run manually against an existing tag

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: test
        run: go test ./... -count=1
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # homebrew tap publishing is skipped until the HOMEBREW_TAP_TOKEN
          # secret (and the cosmoabdon/homebrew-tap repo) exists
          args: release --clean ${{ secrets.HOMEBREW_TAP_TOKEN == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || 'unset' }}
